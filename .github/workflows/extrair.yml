name: Extrair Sorteios Kazola
on:
  schedule:
    # ── Horários em UTC (Angola = UTC+1) ──────────────────────────
    - cron: '5 9 * * *'
    - cron: '10 9 * * *'
    - cron: '20 9 * * *'
    - cron: '5 12 * * *'
    - cron: '10 12 * * *'
    - cron: '20 12 * * *'
    - cron: '5 15 * * *'
    - cron: '10 15 * * *'
    - cron: '20 15 * * *'
    - cron: '5 18 * * *'
    - cron: '10 18 * * *'
    - cron: '20 18 * * *'
    - cron: '0 23 * * *'
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  extrair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Extrair sorteios da API
        run: python .github/workflows/extrair_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
